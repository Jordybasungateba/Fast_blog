<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% if title %}FastAPI Blog - {{ title }}{% else %}FastAPI Blog{% endif %}</title>
        <meta name="description" content="FastAPI Blog">
        <meta name="author" content="Corey Schafer">
        <meta property="og:title" content="{% if title %}FastAPI Blog - {{ title }}{% else %}FastAPI Blog{% endif %}">
        <meta property="og:type" content="website">
        <meta name="theme-color" content="#527c9f">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
              rel="stylesheet"
              integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
              crossorigin="anonymous">
        <link rel="stylesheet" href="{{ url_for('static', path='css/main.css')}} ">
    </head>
    <body class="d-flex flex-column min-vh-100">
        <header class="site-header">
            <nav class="navbar navbar-expand-md bg-steel fixed-top" data-bs-theme="dark">
                <div class="container">
                    <a class="navbar-brand me-4" href="/">FastAPI Blog</a>
                    <button class="navbar-toggler"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#navbarToggle"
                            aria-controls="navbarToggle"
                            aria-expanded="false"
                            aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarToggle">
                        <div class="navbar-nav me-auto">
                            <a class="nav-link active" aria-current="page" href="{{ url_for('home')}}">Home</a>
                        </div>
                        <div class="navbar-nav">
                            <div class="nav-item dropdown">
                                <button class="nav-link dropdown-toggle"
                                        type="button"
                                        id="bd-theme"
                                        data-bs-toggle="dropdown"
                                        aria-expanded="false">
                                    <span id="bd-theme-text">🌗 Auto</span>
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="bd-theme">
                                    <li><button class="dropdown-item" type="button" data-bs-theme-value="light">🌝 Light</button></li>
                                    <li><button class="dropdown-item" type="button" data-bs-theme-value="dark">🌚 Dark</button></li>
                                    <li><button class="dropdown-item" type="button" data-bs-theme-value="auto">🌗 Auto</button></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>
        </header>

        <main class="container site-main" role="main">
            <div class="row">
                <section class="col-md-8" aria-label="Blog posts">
                    {% block content %}{% endblock content %}
                </section>
                <aside class="col-md-4" aria-label="Sidebar">
                    <div class="content-section py-3 px-4 mb-4">
                        <h2 class="h4">Our Sidebar</h2>
                        <p class="text-body-secondary">You can put any information here you'd like.</p>
                        <ul class="list-group">
                            <li class="list-group-item">Latest Posts</li>
                            <li class="list-group-item">Announcements</li>
                            <li class="list-group-item">Calendars</li>
                        </ul>
                    </div>
                </aside>
            </div>
        </main>

        <footer class="mt-auto py-3 bg-body-tertiary border-top">
            <div class="container text-center">
                <p class="text-body-secondary mb-0">&copy; <span id="year"></span>Jordy BASUNGA</p>
            </div>
        </footer>

        <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
                crossorigin="anonymous"></script>
        <script>
            const setTheme = (theme) => {
                const resolvedTheme = theme === 'auto'
                    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : theme;

                document.documentElement.setAttribute('data-bs-theme', resolvedTheme);
                localStorage.setItem('theme', theme);

                const themeLabels = { light: '🌝 Light', dark: '🌚 Dark', auto: '🌗 Auto' };
                document.getElementById('bd-theme-text').textContent = themeLabels[theme];
            };

            document.querySelectorAll('[data-bs-theme-value]').forEach((button) => {
                button.addEventListener('click', () => setTheme(button.getAttribute('data-bs-theme-value')));
            });

            setTheme(localStorage.getItem('theme') || 'auto');
        </script>
    </body>
</html>
